name: Update flake.lock

on:
  workflow_dispatch:
  schedule:
    # every Friday at 17:00 UTC
    - cron: "0 17 * * 5"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flake-dir: "."
            slug: "root"
            eval-attr: "nixosConfigurations"
            eval-apply: "cs: builtins.mapAttrs (_: c: c.config.system.build.toplevel.drvPath) cs"
            eval-flags: ""
          - flake-dir: "home-manager-only"
            slug: "home-manager-only"
            eval-attr: "homeConfigurations"
            eval-apply: "cs: builtins.mapAttrs (_: c: c.activationPackage.drvPath) cs"
            # nixGL reads the host's NVIDIA driver version impurely
            eval-flags: "--impure"
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Update flake.lock
        id: update
        uses: DeterminateSystems/update-flake-lock@main
        with:
          path-to-flake-dir: ${{ matrix.flake-dir }}
          pr-title: "Update flake.lock (${{ matrix.slug }})"
          branch: "update-flake-lock-${{ matrix.slug }}"
          pr-labels: |
            dependencies
            automated

      - name: Check out PR branch
        if: steps.update.outputs.pull-request-number != ''
        uses: actions/checkout@v5
        with:
          ref: update-flake-lock-${{ matrix.slug }}

      # Evaluate every configuration so option renames/removals and missing
      # packages fail the job before anything is merged.
      - name: Evaluate configurations
        if: steps.update.outputs.pull-request-number != ''
        working-directory: ${{ matrix.flake-dir }}
        env:
          # runners have no NVIDIA driver for nixGL to detect; see home-manager-only/flake.nix
          NIXGL_NVIDIA_VERSION: "615.78.08"
        run: |
          nix eval ${{ matrix.eval-flags }} --json \
            '.#${{ matrix.eval-attr }}' \
            --apply '${{ matrix.eval-apply }}'

      - name: Merge PR
        if: steps.update.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge ${{ steps.update.outputs.pull-request-number }} \
            --squash --delete-branch
